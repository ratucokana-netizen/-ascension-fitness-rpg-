name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax smoke test
        run: |
          node --check ascension-v2.js
          node --check shadow-companion.js
          node --check ascension-guild.js
          node --check ascension-extras.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) process.exit(1); fs.writeFileSync('/tmp/ascension-inline.js',m[1]);"
          node --check /tmp/ascension-inline.js
      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html app.js ascension-v2.js shadow-companion.js ascension-guild.js ascension-extras.js hologram-ui.css sw.js manifest.webmanifest www/
          cp icon-*.png www/
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); p.webDir='www'; fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2))"
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascension-Fitness-RPG-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
