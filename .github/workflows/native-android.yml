name: Native Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-android-system
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify build environment
        run: |
          java -version
          gradle --version
          ls -la
          ls -la app/src/main/java/com/ascension/nativeapp
      - name: Build native debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ascension-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
