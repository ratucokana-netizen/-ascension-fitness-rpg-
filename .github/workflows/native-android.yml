name: Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [feature/native-android-system]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ascension-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/*.apk
