<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1b" />
    <title>ASCENSION - Hunter Fitness RPG</title>
    <style>
      :root {
        --bg: #030510;
        --bg-strong: #090d1b;
        --panel: rgba(8, 14, 35, 0.92);
        --panel-soft: rgba(18, 24, 42, 0.82);
        --panel-strong: rgba(17, 24, 40, 0.98);
        --border: rgba(118, 143, 255, 0.32);
        --border-strong: rgba(129, 213, 255, 0.64);
        --text: #edf5ff;
        --text-soft: #a7b7d3;
        --blue: #7bc7ff;
        --cyan: #79e5ff;
        --violet: #9465ff;
        --purple: #b08bff;
        --gold: #f4d981;
        --success: #6ef0c6;
        --warning: #ffbf6b;
        --danger: #ff7f8f;
        --shadow: 0 18px 40px rgba(8, 13, 30, 0.7);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at 50% -10%, rgba(58, 45, 133, 0.42), transparent 50%), radial-gradient(ellipse at 100% 80%, rgba(8, 96, 151, 0.13), transparent 48%), repeating-linear-gradient(0deg, transparent, transparent 47px, rgba(119, 164, 255, 0.022) 48px), #030510;
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      body {
        letter-spacing: 0.02em;
      }

      button, input, textarea, select {
        font: inherit;
      }

      .app-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 18px 52px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        margin-bottom: 18px;
        background: rgba(10, 14, 24, 0.7);
        border: 1px solid rgba(110, 144, 255, 0.2);
        border-radius: 18px;
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        position: relative;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(124, 181, 255, 0.2), rgba(130, 95, 255, 0.34));
        border: 1px solid rgba(108, 210, 255, 0.5);
        box-shadow: inset 0 0 18px rgba(108, 210, 255, 0.28), 0 0 18px rgba(108, 210, 255, 0.14);
      }

      .brand-mark::before {
        content: "A";
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--cyan);
        letter-spacing: 0.12em;
      }

      .brand-name {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .eyebrow {
        font-size: 0.7rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--text-soft);
      }

      .title {
        font-size: clamp(1rem, 1.5vw, 1.2rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-btn {
        appearance: none;
        border: 1px solid rgba(112, 134, 255, 0.28);
        background: rgba(23, 30, 49, 0.84);
        color: var(--text-soft);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .nav-btn:hover,
      .nav-btn.active {
        background: linear-gradient(180deg, rgba(26, 36, 68, 0.96), rgba(17, 25, 43, 0.96));
        border-color: rgba(115, 221, 255, 0.62);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(115, 221, 255, 0.2), 0 0 18px rgba(91, 166, 255, 0.18);
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .panel {
        position: relative;
        background: linear-gradient(180deg, rgba(12, 18, 32, 0.96), rgba(11, 15, 26, 0.9));
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(95, 119, 255, 0.08), transparent 45%, rgba(104, 239, 255, 0.06));
        pointer-events: none;
      }

      .panel-inner {
        position: relative;
        z-index: 1;
        padding: 22px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 16px;
      }

      .hero-title {
        margin: 0 0 12px;
        font-size: clamp(1.6rem, 3vw, 3rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero-copy {
        margin: 0;
        color: var(--text-soft);
        max-width: 62ch;
        line-height: 1.7;
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px rgba(110, 240, 198, 0.9);
        animation: pulse 1.8s infinite ease-in-out;
      }

      .hero-metrics {
        display: grid;
        gap: 12px;
      }

      .metric-card {
        padding: 18px 20px;
        border-radius: 18px;
        background: rgba(15, 20, 35, 0.94);
        border: 1px solid rgba(124, 146, 255, 0.28);
      }

      .metric-label {
        display: block;
        color: var(--text-soft);
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .metric-value {
        font-size: clamp(1.4rem, 2rem, 2.4rem);
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .xp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        color: var(--text-soft);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .progress-track {
        position: relative;
        width: 100%;
        height: 12px;
        border-radius: 999px;
        background: rgba(109, 127, 167, 0.2);
        border: 1px solid rgba(138, 165, 255, 0.2);
        overflow: hidden;
        margin-top: 12px;
      }

      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--purple), var(--gold));
        box-shadow: 0 0 18px rgba(88, 204, 255, 0.7);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 20px;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .section-head h2,
      .section-head h3 {
        margin: 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.86rem;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid rgba(120, 191, 255, 0.26);
        background: rgba(17, 25, 42, 0.7);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .exercise-list {
        display: grid;
        gap: 12px;
      }

      .exercise-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(18, 23, 38, 0.75);
        border: 1px solid rgba(104, 131, 196, 0.2);
      }

      .exercise-item input {
        width: 18px;
        height: 18px;
        accent-color: var(--cyan);
        cursor: pointer;
      }

      .exercise-item .meta {
        display: flex;
        flex-direction: column;
      }

      .exercise-item strong {
        font-size: 0.98rem;
        font-weight: 600;
      }

      .exercise-item span {
        color: var(--text-soft);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .today-card {
        padding: 20px;
        border-radius: 18px;
        background: linear-gradient(160deg, rgba(19, 25, 46, 0.96), rgba(12, 17, 30, 0.96));
        border: 1px solid rgba(123, 162, 255, 0.28);
      }

      .day-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
      }

      .day-pill {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 8px;
        border-radius: 12px;
        border: 1px solid rgba(109, 122, 184, 0.3);
        background: rgba(17, 22, 35, 0.82);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        color: var(--text-soft);
      }

      .day-pill strong {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .day-pill small {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
      }

      .day-pill.active {
        background: linear-gradient(180deg, rgba(18, 33, 57, 0.96), rgba(10, 20, 37, 0.96));
        border-color: rgba(129, 216, 255, 0.62);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(129, 216, 255, 0.18);
      }

      .day-pill.done {
        border-color: rgba(110, 240, 198, 0.48);
      }

      .history-list {
        display: grid;
        gap: 12px;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        border-radius: 16px;
        background: rgba(16, 22, 35, 0.8);
        border: 1px solid rgba(118, 140, 205, 0.24);
      }

      .history-item strong {
        display: block;
        font-size: 0.9rem;
        letter-spacing: 0.06em;
      }

      .history-item span {
        display: block;
        color: var(--text-soft);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(107, 225, 255, 0.08);
        border: 1px solid rgba(107, 225, 255, 0.22);
        color: var(--cyan);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .form-grid {
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-soft);
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid rgba(125, 143, 208, 0.25);
        background: rgba(17, 24, 39, 0.92);
        border-radius: 14px;
        color: var(--text);
        padding: 14px 16px;
        outline: none;
      }

      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: rgba(115, 221, 255, 0.72);
        box-shadow: 0 0 0 3px rgba(72, 168, 255, 0.14);
      }

      .settings-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .action-btn {
        appearance: none;
        border: 1px solid rgba(126, 161, 255, 0.3);
        background: linear-gradient(180deg, rgba(22, 31, 51, 0.98), rgba(13, 18, 31, 0.98));
        color: var(--text);
        padding: 12px 16px;
        border-radius: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .action-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(107, 225, 255, 0.52);
      }

      .action-btn.warn {
        border-color: rgba(255, 137, 162, 0.48);
        color: #ffd1da;
      }

      .action-btn.primary {
        border-color: rgba(118, 195, 255, 0.48);
        color: var(--cyan);
      }

      .system-avatar {
        position: fixed;
        right: 22px;
        top: 115px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-12px) scale(0.92);
        transition: opacity 0.28s ease, transform 0.28s ease;
      }

      .system-avatar.active {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .system-core {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: radial-gradient(circle at center, rgba(105, 235, 255, 0.88), rgba(81, 98, 255, 0.26) 42%, rgba(14, 18, 31, 0.9) 70%);
        border: 1px solid rgba(124, 214, 255, 0.62);
        box-shadow: 0 0 32px rgba(96, 211, 255, 0.26), inset 0 0 18px rgba(113, 207, 255, 0.18);
        animation: idleFloat 4.2s ease-in-out infinite;
      }

      .system-core::before,
      .system-core::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 1px solid rgba(145, 218, 255, 0.5);
      }

      .system-core::after {
        inset: 21px;
        border-color: rgba(167, 131, 255, 0.6);
        box-shadow: inset 0 0 10px rgba(167, 131, 255, 0.3);
      }

      .system-avatar[data-state="speaking"] .system-core {
        animation: speakPulse 0.8s ease-in-out infinite;
      }

      .system-avatar[data-state="idle"] .system-core {
        animation: idleFloat 3.2s ease-in-out infinite;
      }

      .system-caption {
        max-width: 170px;
        text-align: center;
        color: var(--cyan);
        font-size: 0.64rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(110, 224, 255, 0.4);
      }

      .system-toast {
        position: fixed;
        left: 50%;
        top: 28px;
        transform: translateX(-50%) translateY(-14px);
        min-width: min(90vw, 520px);
        padding: 16px 18px;
        border-radius: 16px;
        background: rgba(9, 15, 28, 0.85);
        border: 1px solid rgba(127, 196, 255, 0.32);
        box-shadow: 0 18px 26px rgba(8, 11, 22, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 60;
      }

      .system-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0px);
      }

      .system-toast strong {
        display: block;
        margin-bottom: 4px;
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .system-toast span {
        color: var(--text);
        font-size: 0.95rem;
      }

      .system-overlay {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 10, 19, 0.72);
        backdrop-filter: blur(10px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .system-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      .system-dialogue {
        width: min(88vw, 760px);
        padding: 32px 30px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(8, 12, 23, 0.96), rgba(12, 18, 30, 0.9));
        border: 1px solid rgba(134, 170, 255, 0.35);
        box-shadow: 0 35px 55px rgba(0, 0, 0, 0.42);
      }

      .system-dialogue .eyebrow {
        margin-bottom: 10px;
      }

      .system-dialogue h3 {
        margin: 0 0 14px;
        font-size: clamp(1.3rem, 2.2vw, 2.2rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .system-dialogue p {
        margin: 0;
        color: var(--text-soft);
        line-height: 1.8;
        font-size: 1rem;
      }

      .system-close {
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(118, 197, 255, 0.42);
        background: rgba(16, 29, 48, 0.92);
        color: var(--cyan);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.32); opacity: 0.8; }
      }

      @keyframes idleFloat {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.04); }
      }

      @keyframes speakPulse {
        0%, 100% { transform: scale(1) translateY(0); box-shadow: 0 0 18px rgba(96, 211, 255, 0.22); }
        50% { transform: scale(1.08) translateY(-3px); box-shadow: 0 0 32px rgba(96, 211, 255, 0.5); }
      }


      /* Original procedural shadow companion */
      .shade-card{--shade-primary:#a5b6ff;--shade-secondary:#6654fa;position:relative;display:grid;grid-template-columns:minmax(160px,.7fr) minmax(0,1fr);align-items:center;min-height:290px;overflow:hidden;border:1px solid color-mix(in srgb,var(--shade-primary) 45%,transparent);background:radial-gradient(ellipse at 22% 45%,color-mix(in srgb,var(--shade-secondary) 22%,transparent),transparent 55%),linear-gradient(115deg,#050b1d,#0b1026 70%,#070817);box-shadow:inset 0 0 35px rgba(57,75,172,.12),0 0 28px rgba(71,62,167,.1);margin-bottom:18px}
      .shade-card::before,.shade-card::after{content:"";position:absolute;z-index:1;width:55px;height:2px;background:var(--shade-primary)}
      .shade-card::before{top:0;left:0}.shade-card::after{bottom:0;right:0}
      .shade-art{height:290px;display:grid;place-items:center;overflow:hidden;position:relative}
      .shade-svg{height:100%;max-width:100%;filter:drop-shadow(0 0 17px var(--shade-secondary));overflow:visible}
      .shade-float{transform-box:fill-box;transform-origin:center;animation:shade-hover 4.2s ease-in-out infinite alternate}
      .shade-aura{animation:shade-pulse 3.5s ease-in-out infinite alternate;transform-origin:center}
      .shade-particles{animation:shade-drift 5s ease-in-out infinite alternate}
      .shade-information{position:relative;z-index:2;padding:20px 24px 20px 5px}
      .shade-overline,.shade-meta,.shade-milestones,.shade-guide{font-size:.65rem;letter-spacing:.15em;color:#9eb6e1}
      .shade-overline{color:var(--shade-primary)}
      .shade-title{font-size:clamp(1.35rem,3vw,2.2rem);margin:8px 0;text-transform:uppercase;letter-spacing:.14em;text-shadow:0 0 18px var(--shade-secondary)}
      .shade-title span{font-size:.75rem;color:var(--shade-primary)}
      .shade-copy{font-size:.8rem;line-height:1.6;color:#bac8e2}
      .shade-bar{height:5px;background:#151d3e;margin:18px 0 7px;overflow:hidden}
      .shade-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--shade-secondary),var(--shade-primary));box-shadow:0 0 10px var(--shade-primary)}
      .shade-meta{display:flex;justify-content:space-between;gap:8px}
      .shade-milestones{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
      .shade-milestones span{border:1px solid rgba(100,120,170,.24);padding:7px}
      .shade-milestones span.reached{border-color:var(--shade-primary);color:var(--shade-primary)}
      .shade-compact{min-height:205px;grid-template-columns:160px 1fr}
      .shade-compact .shade-art{height:205px}
      .shade-guide{text-align:center;margin:-6px 0 18px}
      .system-avatar .shade-avatar{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
      .system-avatar .shade-avatar svg{width:90%;height:90%}
      .system-avatar.shade-speaking .shade-eyes{animation:shade-eyes 240ms ease-in-out infinite alternate}
      .system-avatar.shade-speaking .shade-aura{animation:shade-pulse 360ms ease-in-out infinite alternate}
      @keyframes shade-hover{from{translate:0 -5px}to{translate:0 7px}}
      @keyframes shade-pulse{from{opacity:.55;scale:.94}to{opacity:1;scale:1.08}}
      @keyframes shade-drift{from{translate:-4px -6px;opacity:.55}to{translate:7px 8px;opacity:1}}
      @keyframes shade-eyes{from{opacity:.45}to{opacity:1}}
      @media(max-width:560px){.shade-card{grid-template-columns:1fr;min-height:0}.shade-art{height:225px}.shade-information{padding:0 17px 18px}.shade-compact{grid-template-columns:125px 1fr}.shade-compact .shade-art{height:185px}.shade-compact .shade-information{padding:12px 10px}.shade-compact .shade-title{font-size:1rem}.shade-compact .shade-copy{font-size:.68rem}}
      @media(prefers-reduced-motion:reduce){.shade-float,.shade-aura,.shade-particles,.system-avatar.shade-speaking .shade-eyes{animation:none!important}}
      /* Ascension System: original holographic training HUD */
      .topbar { border-radius: 5px; border: 1px solid rgba(118,174,255,.35); background: linear-gradient(120deg,rgba(7,12,30,.98),rgba(16,10,41,.96)); box-shadow: 0 0 35px rgba(83,82,216,.13), inset 0 1px rgba(144,205,255,.13); }
      .brand-mark { transform:rotate(45deg); border-radius:2px; background:linear-gradient(135deg,#201747,#061e3d); }
      .brand-mark::before { transform:rotate(-45deg); color:#c6efff; text-shadow:0 0 10px #60dfff; }
      .title,.hero-title { color:#f4f6ff; text-shadow:0 0 22px rgba(130,109,255,.32); }
      .panel { border-radius:6px; border:1px solid rgba(116,145,245,.3); box-shadow:inset 0 1px rgba(145,197,255,.09),0 15px 35px rgba(0,0,0,.48),0 0 24px rgba(86,56,199,.08); }
      .panel::after { content:""; position:absolute; top:0; left:0; width:55px; height:2px; background:linear-gradient(90deg,#76ddff,transparent); pointer-events:none; }
      .metric-card,.today-card,.history-item,.exercise-item { border-radius:4px; background:linear-gradient(130deg,rgba(14,22,50,.94),rgba(7,12,29,.96)); }
      .nav-btn,.action-btn,.tag,.chip { border-radius:3px; }
      .nav-btn.active { background:linear-gradient(120deg,rgba(45,42,112,.92),rgba(13,39,72,.92)); box-shadow:inset 0 0 14px rgba(116,133,255,.15),0 0 18px rgba(80,147,255,.12); }
      .section-head h2,.section-head h3 { color:#b8d9ff; letter-spacing:.22em; }
      .v2-set { display:grid; grid-template-columns:35px repeat(3,minmax(0,1fr)) auto; gap:8px; align-items:end; padding:13px 8px; margin-top:8px; border:1px solid rgba(95,128,221,.24); background:rgba(6,11,28,.8); }
      .v2-set.logged { border-color:rgba(96,219,255,.6); box-shadow:inset 3px 0 rgba(97,220,255,.6); }
      .v2-set-index { align-self:center; color:#8a80db; font-size:1.05rem; font-weight:800; }
      .v2-set label { display:grid; gap:5px; font-size:.64rem; text-transform:uppercase; letter-spacing:.1em; color:#9cb4db; }
      .v2-set input { width:100%; min-width:0; padding:12px 6px; text-align:center; color:#f3f9ff; font-size:1rem; font-weight:700; border:1px solid rgba(110,158,248,.36); border-radius:2px; background:#080f26; outline:none; }
      .v2-set input:focus { border-color:#8be7ff; box-shadow:0 0 0 2px rgba(96,213,255,.12); }
      .v2-set-status { align-self:center; font-size:.58rem; color:#89a0c4; letter-spacing:.1em; white-space:nowrap; }
      .v2-set.logged .v2-set-status { color:#76e9ff; }
      @media(max-width:560px) { .v2-set { grid-template-columns:25px repeat(3,minmax(0,1fr)); gap:5px; padding:10px 4px; } .v2-set-status { grid-column:2/-1; font-size:.57rem; } .v2-set input {padding:12px 2px;} }
      @media (max-width: 860px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .nav {
          width: 100%;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .grid-2 {
          grid-template-columns: 1fr;
        }

        .day-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .app-shell {
          padding-left: 12px;
          padding-right: 12px;
        }

        .topbar {
          padding: 16px;
        }

        .nav-btn {
          flex: 1 1 calc(50% - 8px);
          text-align: center;
        }

        .day-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .system-avatar {
          top: auto;
          bottom: 18px;
          right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-name">
            <span class="eyebrow">System status</span>
            <span class="title">ASCENSION</span>
          </div>
        </div>
        <nav class="nav" aria-label="Main navigation">
          <button class="nav-btn active" data-tab="dashboard" type="button">Dashboard</button>
          <button class="nav-btn" data-tab="workout" type="button">Workout</button>
          <button class="nav-btn" data-tab="classes" type="button">Classes</button>
          <button class="nav-btn" data-tab="metrics" type="button">Metrics</button>
          <button class="nav-btn" data-tab="history" type="button">History</button>
          <button class="nav-btn" data-tab="settings" type="button">Settings</button>
        </nav>
      </header>

      <main>
        <section id="dashboard" class="view active" aria-live="polite"></section>
        <section id="workout" class="view" aria-live="polite"></section>
        <section id="classes" class="view" aria-live="polite"></section>
        <section id="metrics" class="view" aria-live="polite"></section>
        <section id="history" class="view" aria-live="polite"></section>
        <section id="settings" class="view" aria-live="polite"></section>
      </main>
    </div>

    <div id="systemAvatar" class="system-avatar" data-state="idle" aria-live="polite">
      <div class="system-core" aria-hidden="true"></div>
      <div id="systemCaption" class="system-caption">System online</div>
    </div>

    <div id="toast" class="system-toast" aria-live="polite">
      <strong>System notice</strong>
      <span id="toastMessage">Awaiting directives.</span>
    </div>

    <div id="systemOverlay" class="system-overlay" aria-hidden="true">
      <div class="system-dialogue">
        <div class="eyebrow">System interface</div>
        <h3>Direct transmission</h3>
        <p id="systemDialogueText">Initialising training protocols.</p>
        <button id="systemClose" class="system-close" type="button">Acknowledge</button>
      </div>
    </div>

    <script src="./ascension-v2.js"></script>
    <script src="./shadow-companion.js"></script>
    <script>
      'use strict';

      const STORAGE_KEY = 'ascension_v1';
      const workoutTypes = ['Push A', 'Rest', 'Pull A', 'Legs A', 'Rotate', 'Run', 'Rest'];
      const exercises = {
        'Push A': ['Barbell Bench Press', 'Incline Dumbbell Press', 'Seated Shoulder Press', 'Dumbbell Lateral Raise', 'Cable Triceps Pushdown'],
        'Pull A': ['Lat Pulldown', 'Seated Cable Row', 'Chest-Supported Row', 'Reverse Pec Deck', 'Dumbbell Biceps Curl', 'Hammer Curl'],
        'Legs A': ['Barbell Squat', 'Leg Press', 'Romanian Deadlift', 'Seated Leg Curl', 'Standing Calf Raise'],
        'Push B': ['Incline Dumbbell Press', 'Machine Chest Press', 'Cable Lateral Raise', 'Overhead Triceps Extension'],
        'Pull B': ['Close-Grip Pulldown', 'Single-Arm Dumbbell Row', 'Face Pull', 'Preacher Curl'],
        'Legs B': ['Hack Squat', 'Leg Extension', 'Lying Leg Curl', 'Seated Calf Raise'],
        'Run': ['Saturday Run — 25–35 min easy pace']
      };

      let state = {};
      let selected = todayISO();
      let tab = 'dashboard';
      let toastTimer = 0;

      function localISO(date) {
        return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
      }

      function parseISO(iso) {
        const [year, month, day] = iso.split('-').map(Number);
        return new Date(year, (month || 1) - 1, day || 1);
      }

      function todayISO() {
        return localISO(new Date());
      }

      function monday(dateISO) {
        const date = parseISO(dateISO);
        const day = date.getDay();
        const diff = (day === 0 ? -6 : 1) - day; // Monday start
        date.setDate(date.getDate() + diff);
        return localISO(date);
      }

      function addDays(iso, amount) {
        const date = parseISO(iso);
        date.setDate(date.getDate() + amount);
        return localISO(date);
      }

      function workoutFor(dateISO) {
        const date = parseISO(dateISO);
        const day = date.getDay();
        if (day === 0 || day === 2) return 'Rest';
        if (day === 1) return 'Push A';
        if (day === 3) return 'Legs A';
        if (day === 4) return 'Rotate';
        if (day === 5) return 'Run';
        if (day === 6) return 'Rest';
        return 'Pull A';
      }

      function safeLoad() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (error) {
          return {};
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function record(dateISO) {
        state.records ||= {};
        state.records[dateISO] ||= { items: {}, claimed: false };
        return state.records[dateISO];
      }

      function xp() {
        let total = 0;
        for (const entry of Object.values(state.records || {})) {
          for (const item of Object.values(entry.items || {})) {
            if (item.done) total += Number(item.xp || 0);
          }
          if (entry.claimed) total += 150;
        }
        return total;
      }

      function itemFor(dateISO, exerciseName) {
        const rec = record(dateISO);
        rec.items ||= {};
        const key = exerciseName.toLowerCase().replace(/[^a-z0-9]+/g, '_');
        rec.items[key] ||= { name: exerciseName, done: false, xp: exerciseName.toLowerCase().includes('run') ? 100 : 30 };
        return rec.items[key];
      }

      function formatDateLabel(dateISO) {
        return parseISO(dateISO).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      }

      function setSystemState(active, speaking) {
        const avatar = document.getElementById('systemAvatar');
        if (!avatar) return;
        avatar.classList.toggle('active', !!active);
        avatar.dataset.state = speaking ? 'speaking' : 'idle';
        if (window.AscensionShadow) window.AscensionShadow.speaking(!!speaking);
      }

      let voiceRequest = 0;

      async function speakSystemMessage(message) {
        const request = ++voiceRequest;
        const avatar = document.getElementById('systemAvatar');
        const caption = document.getElementById('systemCaption');
        const plainText = message.replace(/[+✓·]/g, '').trim();
        const nativeTTS = window.Capacitor?.Plugins?.TextToSpeech;
        const voiceProfile = state.settings?.voiceProfile || 'jarvis';
        const voiceRate = voiceProfile === 'jarvis' ? 0.94 : 0.9;
        const voicePitch = voiceProfile === 'jarvis' ? 0.88 : 1.0;
        const voiceLocale = voiceProfile === 'jarvis' ? 'en-GB' : 'en-US';

        if (caption) caption.textContent = 'Transmitting';
        setSystemState(true, true);

        try {
          if (nativeTTS && window.Capacitor?.isNativePlatform?.()) {
            await nativeTTS.stop().catch(() => {});
            if (request !== voiceRequest) return;
            await nativeTTS.speak({ text: plainText, lang: voiceLocale, rate: voiceRate, pitch: voicePitch, volume: 1, category: 'playback' });
          } else if ('speechSynthesis' in window) {
            const synth = window.speechSynthesis;
            synth.cancel();
            await new Promise((resolve, reject) => {
              const utterance = new SpeechSynthesisUtterance(plainText);
              utterance.lang = voiceLocale;
              utterance.rate = voiceRate;
              utterance.pitch = voicePitch;
              const availableVoices = synth.getVoices();
              const britishVoice = availableVoices.find(v => v.lang.toLowerCase().startsWith('en-gb'));
              if (voiceProfile === 'jarvis' && britishVoice) utterance.voice = britishVoice;
              utterance.volume = 1;
              utterance.onend = resolve;
              utterance.onerror = (event) => reject(new Error(event.error || 'Speech unavailable'));
              synth.speak(utterance);
            });
          } else {
            throw new Error('Speech engine unavailable');
          }
          if (request === voiceRequest && caption) caption.textContent = 'System online';
        } catch (error) {
          console.warn('System voice failed:', error);
          if (request === voiceRequest) {
            if (caption) caption.textContent = 'Voice unavailable';
            const toastMessage = document.getElementById('toastMessage');
            if (toastMessage) toastMessage.textContent = 'System voice unavailable. Check Android text-to-speech settings.';
            document.getElementById('toast')?.classList.add('visible');
          }
        } finally {
          if (request === voiceRequest) setSystemState(true, false);
        }
      }

      function showNotification(message, options = {}) {
        const { voice = true, overlay = false } = options;
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        if (toast && toastMessage) {
          toastMessage.textContent = message;
          toast.classList.add('visible');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove('visible'), 4000);
        }

        const overlayEl = document.getElementById('systemOverlay');
        const overlayText = document.getElementById('systemDialogueText');
        if (overlayEl && overlayText) {
          overlayText.textContent = message;
          if (overlay) {
            overlayEl.classList.add('visible');
            overlayEl.setAttribute('aria-hidden', 'false');
          }
        }

        setSystemState(true, false);
        if (voice && state.settings?.speechEnabled) {
          void speakSystemMessage(message);
        }
      }

            function renderDashboard() {
        const totalXP = xp() + (state.v2?.sessions || []).reduce((total, session) => total + Math.min(300, 100 + (session.exercises || []).reduce((n, ex) => n + (ex.sets || []).filter(set => set.done && !set.warmup).length * 15, 0)), 0);
        const progress = totalXP % 500;
        const percent = Math.min(100, Math.round((progress / 500) * 100));
        const workout = workoutFor(selected);
        const dailyRecord = record(selected);
        const completed = Object.values(dailyRecord.items || {}).filter((item) => item.done).length;
        const totalForDay = workout === 'Rest' ? 0 : (exercises[workout] || []).length;

        document.getElementById('dashboard').innerHTML = `
          <div class="panel hero">
            <div class="panel-inner">
              <div class="status-line"><span class="status-dot"></span> Hunter status</div>
              <h1 class="hero-title">${escapeHTML(state.name || 'HUNTER')}</h1>
              <p class="hero-copy">${escapeHTML(state.name || 'HUNTER')} remains aligned with the current cycle. ${workout === 'Rest' ? 'Recovery protocols remain active.' : 'Combat drills are live.'}</p>
              <div class="xp-row" style="margin-top:20px;">
                <span>Total XP</span>
                <span>${totalXP}</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width:${percent}%"></div>
              </div>
            </div>
            <div class="panel-inner hero-metrics">
              <div class="metric-card">
                <span class="metric-label">Current objective</span>
                <div class="metric-value">${workout === 'Rest' ? 'Recovery' : workout}</div>
              </div>
              <div class="metric-card">
                <span class="metric-label">Daily completion</span>
                <div class="metric-value">${completed}/${totalForDay || 0}</div>
                <div class="xp-row">
                  <span>Cycle</span>
                  <span>${formatDateLabel(selected)}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="panel stack">
              <div class="panel-inner">
                <div class="section-head">
                  <h2>Mission board</h2>
                  <span class="tag">Active</span>
                </div>
                <div class="exercise-list">
                  <div class="exercise-item"><div class="meta"><strong>Manual training log</strong><span>Open Workout to enter sets, reps and weight. No checklist required.</span></div></div>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-inner">
                <div class="section-head">
                  <h3>Week overview</h3>
                  <span class="tag">RPG</span>
                </div>
                <div class="today-card">
                  <div class="day-grid">
                    ${Array.from({ length: 7 }, (_, index) => {
                      const dayISO = addDays(monday(selected), index);
                      const dayWorkout = workoutFor(dayISO);
                      const isActive = dayISO === selected;
                      const complete = Object.values(record(dayISO).items || {}).filter((item) => item.done).length;
                      return `
                        <button class="day-pill ${isActive ? 'active' : ''} ${complete > 0 ? 'done' : ''}" type="button" data-select-day="${dayISO}">
                          <strong>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][index]}</strong>
                          <small>${dayWorkout === 'Rest' ? 'Rest' : dayWorkout.replace(' A', '').replace(' B', '')}</small>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        document.querySelectorAll('[data-select-day]').forEach((button) => {
          button.addEventListener('click', () => {
            selected = button.dataset.selectDay;
            render();
          });
        });


      }

      function renderWorkout() {
        const weekStart = monday(selected);
        const currentWorkout = workoutFor(selected);

        const dayCards = Array.from({ length: 7 }, (_, index) => {
          const iso = addDays(weekStart, index);
          const workout = workoutFor(iso);
          const isSelected = iso === selected;
          const doneCount = Object.values(record(iso).items || {}).filter((item) => item.done).length;
          return `
            <button class="day-pill ${isSelected ? 'active' : ''} ${doneCount > 0 ? 'done' : ''}" type="button" data-select-day="${iso}">
              <strong>${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][index]}</strong>
              <small>${workout}</small>
            </button>
          `;
        }).join('');

        const workoutItems = '<div class="exercise-item"><div class="meta"><strong>Session input</strong><span>Use the tracker above to record reps and load for each set.</span></div></div>';

        document.getElementById('workout').innerHTML = `
          <div id="training-v2"></div>
          <div class="panel">
            <div class="panel-inner">
              <div class="section-head">
                <h2>Training protocol</h2>
                <span class="tag">${currentWorkout}</span>
              </div>
              <div class="today-card" style="margin-bottom:18px;">
                <div class="day-grid">${dayCards}</div>
              </div>
              <div class="exercise-list">${workoutItems}</div>
            </div>
          </div>
        `;

        document.querySelectorAll('[data-select-day]').forEach((button) => {
          button.addEventListener('click', () => {
            selected = button.dataset.selectDay;
            render();
          });
        });


      }

      function renderHistory() {
        const historyDates = Object.keys(state.records || {}).sort().reverse();
        const entries = historyDates.length
          ? historyDates.map((dateISO) => {
              const entry = state.records[dateISO];
              const done = Object.values(entry.items || {}).filter((item) => item.done).length;
              const xpValue = Object.values(entry.items || {}).reduce((sum, item) => sum + (item.done ? Number(item.xp || 0) : 0), 0) + (entry.claimed ? 150 : 0);
              return `
                <div class="history-item">
                  <div>
                    <strong>${formatDateLabel(dateISO)}</strong>
                    <span>${done} objectives cleared</span>
                  </div>
                  <div class="chip">+${xpValue} XP</div>
                </div>
              `;
            }).join('')
          : '<div class="history-item"><div><strong>No combat logs yet</strong><span>Complete an objective to begin your archive.</span></div></div>';

        document.getElementById('history').innerHTML = `
          <div id="v2history"></div>
          <div class="panel">
            <div class="panel-inner">
              <div class="section-head">
                <h2>Archive</h2>
                <span class="tag">${historyDates.length} days</span>
              </div>
              <div class="history-list">${entries}</div>
            </div>
          </div>
        `;
      }

      function renderSettings() {
        const speechEnabled = Boolean(state.settings?.speechEnabled ?? true);
        document.getElementById('settings').innerHTML = `
          <div class="panel">
            <div class="panel-inner">
              <div class="section-head">
                <h2>System configuration</h2>
                <span class="tag">Profile</span>
              </div>
              <div class="form-grid">
                <div class="field">
                  <label for="hunterName">Hunter designation</label>
                  <input id="hunterName" maxlength="20" value="${escapeHTML(state.name || 'HUNTER')}" />
                </div>
                <div class="field">
                  <label for="voiceProfile">Voice personality</label>
                  <select id="voiceProfile">
                    <option value="jarvis" ${state.settings?.voiceProfile !== 'standard' ? 'selected' : ''}>Sentinel — British AI assistant</option>
                    <option value="standard" ${state.settings?.voiceProfile === 'standard' ? 'selected' : ''}>Standard — neutral</option>
                  </select>
                </div>
                <div class="field">
                  <label for="voiceMode">System voice</label>
                  <select id="voiceMode">
                    <option value="enabled" ${speechEnabled ? 'selected' : ''}>Enabled</option>
                    <option value="disabled" ${!speechEnabled ? 'selected' : ''}>Muted</option>
                  </select>
                </div>
              </div>
              <div class="settings-actions" style="margin-top:20px;">
                <button id="testVoice" class="action-btn primary" type="button">Test System Voice</button>
                <button id="exportBackup" class="action-btn primary" type="button">Export backup</button>
                <label for="importBackup" class="action-btn" style="cursor:pointer;">Import backup</label>
                <input id="importBackup" type="file" accept="application/json" style="display:none;" />
                <button id="resetProgress" class="action-btn warn" type="button">Reset progress</button>
              </div>
            </div>
          </div>
        `;

        const hunterNameInput = document.getElementById('hunterName');
        hunterNameInput.addEventListener('input', (event) => {
          state.name = event.target.value.toUpperCase().slice(0, 20);
          save();
          renderDashboard();
        });

        document.getElementById('voiceProfile').addEventListener('change', (event) => {
          state.settings ||= {};
          state.settings.voiceProfile = event.target.value;
          save();
          showNotification('Voice profile updated.', { voice: false });
        });

        document.getElementById('voiceMode').addEventListener('change', (event) => {
          state.settings ||= {};
          state.settings.speechEnabled = event.target.value === 'enabled';
          save();
          showNotification(state.settings.speechEnabled ? 'System voice enabled' : 'System voice muted', { voice: false, overlay: true });
        });

        document.getElementById('testVoice').addEventListener('click', () => {
          showNotification('Good evening, Hunter. All systems are operational. Your training protocol is ready. Shall we begin?', { voice: true, overlay: false });
        });

        document.getElementById('exportBackup').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'ascension-backup.json';
          link.click();
          URL.revokeObjectURL(url);
          showNotification('Backup export queued', { voice: true, overlay: false });
        });

        document.getElementById('importBackup').addEventListener('change', (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const imported = JSON.parse(String(reader.result));
              state = { ...state, ...imported };
              save();
              render();
              showNotification('Archive synced successfully', { voice: true, overlay: true });
            } catch (error) {
              showNotification('Import failed: invalid backup file', { voice: true, overlay: true });
            }
          };
          reader.readAsText(file);
          event.target.value = '';
        });

        document.getElementById('resetProgress').addEventListener('click', () => {
          const confirmed = window.confirm('Reset all training data and return to a fresh hunter profile?');
          if (!confirmed) return;
          state = { start: todayISO(), records: {}, weights: {}, name: 'HUNTER', progressPct: 2.5, settings: { speechEnabled: true } };
          save();
          render();
          showNotification('Hunter profile reset. New cycle initialized.', { voice: true, overlay: true });
        });
      }

      const CLASS_PROFILES = {
        vanguard: { name: 'Vanguard', focus: 'Strength', exercises: ['Barbell Squat', 'Barbell Bench Press', 'Romanian Deadlift', 'Seated Cable Row'] },
        berserker: { name: 'Berserker', focus: 'Hypertrophy', exercises: ['Incline Dumbbell Press', 'Leg Press', 'Lat Pulldown', 'Dumbbell Lateral Raise'] },
        shadow: { name: 'Shadow', focus: 'Athleticism', exercises: ['Goblet Squat', 'Dumbbell Step-Up', 'Push-Up', 'Mountain Climbers'] },
        sentinel: { name: 'Sentinel', focus: 'Endurance', exercises: ['Easy Run', 'Incline Walk', 'Bodyweight Squat', 'Plank'] },
        warden: { name: 'Warden', focus: 'Hybrid', exercises: ['Barbell Squat', 'Dumbbell Bench Press', 'Seated Cable Row', 'Easy Run'] }
      };

      function renderClassSelection() {
        const selectedClass = state.trainingClass || 'warden';
        document.getElementById('classes').innerHTML = `
          <div class="panel"><div class="panel-inner">
            <div class="section-head"><h2>Training class</h2><span class="tag">Ascension 2.0</span></div>
            <p>Choose your combat identity. Your existing training logs and achievements are preserved.</p>
            <div class="form-grid">
              <div class="field"><label for="trainingClass">Class specialization</label>
                <select id="trainingClass">${Object.entries(CLASS_PROFILES).map(([id, cls]) => `<option value="${id}" ${selectedClass === id ? 'selected' : ''}>${cls.name} — ${cls.focus}</option>`).join('')}</select>
              </div>
            </div>
            <div class="section-head" style="margin-top:20px;"><h2>Class training focus</h2></div>
            <div class="exercise-list">${CLASS_PROFILES[selectedClass].exercises.map(ex => `<div class="exercise-item"><div class="meta"><strong>${escapeHTML(ex)}</strong><span>Suggested movement · ${CLASS_PROFILES[selectedClass].focus}</span></div></div>`).join('')}</div>
            <p class="hero-copy">Class-specific programs and progression will be expanded in upcoming releases.</p>
          </div></div>`;
        document.getElementById('trainingClass').addEventListener('change', event => {
          state.trainingClass = event.target.value;
          save();
          renderClassSelection();
          showNotification(`Class selected: ${CLASS_PROFILES[state.trainingClass].name}`, { voice: true });
        });
      }

      function render() {
        document.querySelectorAll('.nav-btn').forEach((button) => {
          button.classList.toggle('active', button.dataset.tab === tab);
        });
        document.querySelectorAll('.view').forEach((view) => {
          view.classList.toggle('active', view.id === tab);
        });

        renderDashboard();
        renderWorkout();
        renderHistory();
        if (window.AscensionV2) window.AscensionV2.render();
        else renderClassSelection();
        renderSettings();
        if (window.AscensionShadow) window.AscensionShadow.render();
      }

      function initialize() {
        state = safeLoad();
        state.records ||= {};
        state.weights ||= {};
        state.name ||= 'HUNTER';
        state.progressPct ??= 2.5;
        state.settings ||= { speechEnabled: true };
        state.start ||= monday(todayISO());

        document.querySelectorAll('[data-tab]').forEach((button) => {
          button.addEventListener('click', () => {
            tab = button.dataset.tab;
            render();
          });
        });

        document.getElementById('systemClose').addEventListener('click', () => {
          document.getElementById('systemOverlay').classList.remove('visible');
          document.getElementById('systemOverlay').setAttribute('aria-hidden', 'true');
        });

        setSystemState(true, false);
        showNotification('System initialized. Training protocols online.', { voice: true, overlay: true });
        render();
        if (window.AscensionV2) window.AscensionV2.init();
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = () => {
          if (state.settings?.speechEnabled) {
            showNotification('System voice ready.', { voice: false, overlay: false });
          }
        };
      }

      initialize();
    </script>
  </body>
</html>
